<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roblox</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  body {
    background: #e3e3e3;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background-image: radial-gradient(circle at 50% 0%, #f0f0f0 0%, #d8d8d8 100%);
  }

  .container {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }

  .logo {
    width: 140px;
    height: auto;
    margin-bottom: 25px;
  }

  .login-box {
    background: #ffffff;
    border-radius: 8px;
    padding: 30px 28px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    text-align: left;
  }

  .login-box h1 {
    font-size: 24px;
    font-weight: 700;
    color: #232527;
    margin-bottom: 20px;
    text-align: center;
  }

  .field {
    margin-bottom: 16px;
  }

  .field input {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    border: 1px solid #c4c4c4;
    border-radius: 6px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
    color: #232527;
  }

  .field input:focus {
    border-color: #00a2ff;
    box-shadow: 0 0 0 3px rgba(0,162,255,0.2);
  }

  .login-btn {
    width: 100%;
    padding: 12px;
    background: #00a2ff;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 8px;
    transition: background .15s;
  }

  .login-btn:hover {
    background: #008ede;
  }

  .divider {
    display: flex;
    align-items: center;
    margin: 22px 0;
    color: #999;
    font-size: 13px;
  }

  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #ddd;
  }

  .divider span {
    padding: 0 12px;
  }

  .alt-btn {
    width: 100%;
    padding: 11px;
    background: #fff;
    color: #232527;
    font-size: 15px;
    font-weight: 600;
    border: 1px solid #c4c4c4;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background .15s;
  }

  .alt-btn:hover {
    background: #f5f5f5;
  }

  .links {
    margin-top: 18px;
    text-align: center;
    font-size: 14px;
  }

  .links a {
    color: #00a2ff;
    text-decoration: none;
  }

  .links a:hover {
    text-decoration: underline;
  }

  .links p {
    margin-bottom: 8px;
    color: #555;
  }

  .footer {
    margin-top: 24px;
    font-size: 12px;
    color: #888;
    text-align: center;
    line-height: 1.6;
  }

  .footer a {
    color: #888;
    text-decoration: underline;
  }
</style>
</head>
<body>

<div class="container">
  <!-- Логотип Roblox (SVG) -->
  <svg class="logo" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
    <text x="0" y="45" font-family="Arial, sans-serif" font-size="46" font-weight="900" fill="#232527" letter-spacing="-1">ROBLOX</text>
  </svg>

  <div class="login-box">
    <h1>Вход</h1>

    <form onsubmit="event.preventDefault(); alert('Демо: вход не выполняется');">
      <div class="field">
        <input type="text" placeholder="Имя пользователя или Email" required>
      </div>
      <div class="field">
        <input type="password" placeholder="Пароль" required>
      </div>
      <button class="login-btn" type="submit">Войти</button>
    </form>

    <div class="divider"><span>ИЛИ</span></div>

    <button class="alt-btn" onclick="alert('Демо: вход через код не выполняется')">
      🔑 Войти с помощью кода
    </button>

    <div class="links">
      <p><a href="#">Забыли пароль?</a></p>
      <p>Нет аккаунта? <a href="#">Зарегистрироваться</a></p>
    </div>
  </div>

  <div class="footer">
    © 2024 Roblox Corporation. Все права защищены.<br>
    <a href="#">Условия использования</a> · <a href="#">Политика конфиденциальности</a>
  </div>
</div>

</body>
</html>
