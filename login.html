<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roblox - Sign In</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Builder Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  body {
    background-color: #000;
    /* Фон с игровыми картинками (имитация скриншота) */
    background-image: 
      linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.8)),
      url('https://images.rbxcdn.com/9c2c0f6d1b4a44e3e3e3e3e3e3e3e3e3'); 
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px;
    color: #fff;
  }

  .container {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* SVG Логотип Roblox */
  .logo {
    width: 200px;
    height: auto;
    margin-bottom: 25px;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
  }

  /* Темная карточка */
  .login-box {
    background: #232527;
    border-radius: 8px;
    padding: 30px;
    width: 100%;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    text-align: left;
  }

  .login-box h1 {
    font-size: 24px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 20px;
  }

  .field {
    margin-bottom: 18px;
  }

  .field label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 6px;
  }

  .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .field input {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    background: #232527;
    border: 1px solid #555;
    border-radius: 6px;
    outline: none;
    color: #fff;
    transition: border-color .15s;
  }

  .field input::placeholder {
    color: #888;
  }

  .field input:focus {
    border-color: #00a2ff;
    box-shadow: 0 0 0 1px #00a2ff;
  }

  /* Иконка глаза для пароля */
  .eye-icon {
    position: absolute;
    right: 12px;
    cursor: pointer;
    fill: #888;
  }
  .eye-icon:hover {
    fill: #ccc;
  }

  /* Основная кнопка Sign In (неактивная как на скрине) */
  .login-btn {
    width: 100%;
    padding: 12px;
    background: #3b3e41;
    color: #888;
    font-size: 16px;
    font-weight: 700;
    border: none;
    border-radius: 6px;
    cursor: not-allowed;
    margin-top: 10px;
    margin-bottom: 15px;
  }

  /* Ссылки */
  .forgot-link {
    display: inline-block;
    color: #fff;
    font-size: 14px;
    text-decoration: none;
    margin-bottom: 20px;
    border-bottom: 1px solid transparent;
  }
  .forgot-link:hover {
    border-bottom: 1px solid #fff;
  }

  /* Разделитель OR */
  .divider {
    display: flex;
    align-items: center;
    margin: 15px 0 20px;
    color: #888;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
  }

  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #3b3e41;
  }

  .divider span {
    padding: 0 12px;
  }

  /* Кнопки методов (Email, QR) */
  .method-btn {
    width: 100%;
    padding: 12px;
    background: #3b3e41;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 10px;
    transition: background .15s;
  }

  .method-btn:hover {
    background: #4a4e52;
  }

  .method-btn svg {
    width: 20px;
    height: 20px;
    fill: #fff;
  }

  /* Подвал карточки */
  .footer-text {
    margin-top: 25px;
    font-size: 14px;
    text-align: center;
    color: #fff;
  }

  .footer-text a {
    color: #fff;
    font-weight: 700;
    text-decoration: none;
  }
  .footer-text a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

<div class="container">
  <!-- Официальный SVG-логотип Roblox -->
  <svg class="logo" viewBox="0 0 256 60" xmlns="http://www.w3.org/2000/svg">
    <!-- R -->
    <path d="M 10 10 L 10 50 L 22 50 L 22 34 L 30 34 L 38 50 L 52 50 L 42 32 C 48 30 52 25 52 18 C 52 12 47 10 40 10 Z M 22 24 L 22 20 L 36 20 C 38 20 40 21 40 24 C 40 27 38 28 36 28 L 22 28 Z" fill="#fff"/>
    <!-- O -->
    <path d="M 70 10 C 58 10 55 20 55 30 C 55 40 58 50 70 50 C 82 50 85 40 85 30 C 85 20 82 10 70 10 Z M 70 40 C 66 40 65 35 65 30 C 65 25 66 20 70 20 C 74 20 75 25 75 30 C 75 35 74 40 70 40 Z" fill="#fff"/>
    <!-- B -->
    <path d="M 95 10 L 95 50 L 115 50 C 125 50 130 45 130 38 C 130 32 126 28 120 27 C 124 26 126 22 126 18 C 126 12 122 10 114 10 Z M 107 20 L 112 20 C 115 20 116 21 116 24 C 116 27 115 28 112 28 L 107 28 Z M 107 36 L 114 36 C 117 36 118 37 118 40 C 118 43 117 44 114 44 L 107 44 Z" fill="#fff"/>
    <!-- L -->
    <path d="M 140 10 L 140 50 L 165 50 L 165 40 L 152 40 L 152 10 Z" fill="#fff"/>
    <!-- O -->
    <path d="M 185 10 C 173 10 170 20 170 30 C 170 40 173 50 185 50 C 197 50 200 40 200 30 C 200 20 197 10 185 10 Z M 185 40 C 181 40 180 35 180 30 C 180 25 181 20 185 20 C 189 20 190 25 190 30 C 190 35 189 40 185 40 Z" fill="#fff"/>
    <!-- X -->
    <path d="M 212 10 L 225 30 L 212 50 L 225 50 L 232 37 L 239 50 L 252 50 L 239 30 L 252 10 L 239 10 L 232 23 L 225 10 Z" fill="#fff"/>
  </svg>

  <div class="login-box">
    <h1>Sign in</h1>

    <form onsubmit="event.preventDefault();">
      <div class="field">
        <label>Username, email, or phone</label>
        <div class="input-wrapper">
          <input type="text" placeholder="Username, email, or phone">
        </div>
      </div>

      <div class="field">
        <label>Password</label>
        <div class="input-wrapper">
          <input type="password" placeholder="Password">
          <!-- Иконка перечеркнутого глаза -->
          <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24">
            <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
          </svg>
        </div>
      </div>

      <button class="login-btn" type="button">Sign in</button>
    </form>

    <a href="#" class="forgot-link">Forgot password or username?</a>

    <div class="divider"><span>OR</span></div>

    <!-- Кнопки методов входа с вашим сообщением -->
    <button class="method-btn" onclick="showError()">
      <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
      Email a code
    </button>

    <button class="method-btn" onclick="showError()">
      <svg viewBox="0 0 24 24"><path d="M3 11h8V3H3v8zm2-6h4v4H5V5zM3 21h8v-8H3v8zm2-6h4v4H5v-4zM13 3v8h8V3h-8zm6 6h-4V5h4v4zM13 13h8v8h-8v-8zm2 2h4v4h-4v-4z"/></svg>
      QR code
    </button>

    <button class="method-btn" onclick="showError()">
      Other sign-in options
    </button>

    <div class="footer-text">
      Don't have an account? <a href="#">Create one</a>
    </div>
  </div>
</div>

<script>
  function showError() {
    alert('В "логине через" нельзя использовать методы');
  }
</script>

</body>
</html>
